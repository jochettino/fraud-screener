name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and test
        run: ./gradlew build
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore

  docker:
    name: docker
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: fraud-screener-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start container
        run: docker run -d --name fs -p 8080:8080 fraud-screener-api:ci
      - name: Wait for /health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health; then
              echo
              echo "Healthy after attempt $i"
              exit 0
            fi
            sleep 2
          done
          echo "Container did not become healthy" >&2
          exit 1
      - name: Assert container runs as non-root
        run: |
          uid=$(docker exec fs id -u)
          echo "uid=$uid"
          if [ "$uid" = "0" ]; then
            echo "Container runs as root" >&2
            exit 1
          fi
      - name: Container logs on failure
        if: failure()
        run: docker logs fs
      - name: Cleanup
        if: always()
        run: docker rm -f fs
